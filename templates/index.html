<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoPrice AI | Car Price Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #1e3a8a 0%, transparent 35%),
                radial-gradient(circle at bottom right, #312e81 0%, transparent 35%),
                #080b16;

            color: white;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        /* Main Card */

        .app {
            width: 100%;
            max-width: 1000px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(20px);

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45);
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: auto;
            margin-bottom: 18px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            box-shadow:
                0 10px 30px rgba(37, 99, 235, 0.4);
        }

        h1 {
            font-size: 36px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #aeb7cf;
            font-size: 16px;
        }

        /* Form */

        .form {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 22px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: span 2;
        }

        label {
            font-size: 14px;
            font-weight: 600;

            margin-bottom: 8px;

            color: #dbe4ff;
        }

        input,
        select {

            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.15);

            background: rgba(255,255,255,0.07);

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }

        input::placeholder {
            color: #8993ad;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #111827;
            color: white;
        }

        input:focus,
        select:focus {

            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59,130,246,0.15);
        }

        /* Button */

        .predict-btn {

            grid-column: span 2;

            margin-top: 8px;

            padding: 16px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 10px 30px rgba(37,99,235,0.3);
        }

        .predict-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(37,99,235,0.45);
        }

        /* Result */

        .result {

            margin-top: 35px;

            padding: 25px;

            border-radius: 18px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,0.18),
                    rgba(124,58,237,0.18)
                );

            border: 1px solid rgba(96,165,250,0.25);
        }

        .result-label {

            color: #aeb7cf;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .price {

            font-size: 38px;

            font-weight: 800;

            color: #60a5fa;
        }

        .result-note {

            margin-top: 8px;

            color: #94a3b8;

            font-size: 13px;
        }

        /* Footer */

        .footer {

            margin-top: 30px;

            padding-top: 20px;

            border-top:
                1px solid rgba(255,255,255,0.08);

            text-align: center;

            color: #7f8aa3;

            font-size: 13px;
        }

        .tech {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 12px;
        }

        .badge {

            padding: 6px 11px;

            border-radius: 20px;

            background: rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.1);

            color: #aeb7cf;

            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .app {
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: span 1;
            }

            .predict-btn {
                grid-column: span 1;
            }

        }

    </style>

</head>


<body>

<div class="app">

    <!-- Header -->

    <div class="header">

        <div class="logo">
            🚗
        </div>

        <h1>
            AutoPrice AI
        </h1>

        <p class="subtitle">
            Machine Learning Powered Car Price Prediction
        </p>

    </div>


    <!-- Form -->

    <form
        class="form"
        action="/predict"
        method="POST"
    >

        <!-- Car Name -->

        <div class="field full">

            <label for="name">
                Car Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="e.g. Hyundai Santro Xing"
                required
            >

        </div>


        <!-- Company -->

        <div class="field">

            <label for="company">
                Company
            </label>

            <input
                type="text"
                id="company"
                name="company"
                placeholder="e.g. Hyundai"
                required
            >

        </div>


        <!-- Year -->

        <div class="field">

            <label for="year">
                Manufacturing Year
            </label>

            <input
                type="number"
                id="year"
                name="year"
                placeholder="e.g. 2018"
                min="1990"
                max="2026"
                required
            >

        </div>


        <!-- KM -->

        <div class="field">

            <label for="kms_driven">
                Kilometers Driven
            </label>

            <input
                type="number"
                id="kms_driven"
                name="kms_driven"
                placeholder="e.g. 45000"
                min="0"
                required
            >

        </div>


        <!-- Fuel -->

        <div class="field">

            <label for="fuel_type">
                Fuel Type
            </label>

            <select
                id="fuel_type"
                name="fuel_type"
                required
            >

                <option value="">
                    Select fuel type
                </option>

                <option value="Petrol">
                    Petrol
                </option>

                <option value="Diesel">
                    Diesel
                </option>

                <option value="CNG">
                    CNG
                </option>

            </select>

        </div>


        <!-- Button -->

        <button
            type="submit"
            class="predict-btn"
        >
            Predict Car Price
        </button>

    </form>


    <!-- Prediction -->

    {% if prediction is not none %}

    <div class="result">

        <div class="result-label">
            Estimated Market Price
        </div>

        <div class="price">
            ₹ {{ prediction }} Lakhs
        </div>

        <div class="result-note">
            Prediction generated using a machine learning regression model
        </div>

    </div>

    {% endif %}


    <!-- Footer -->

    <div class="footer">

        <div>
            Built with Machine Learning & Python
        </div>

        <div class="tech">

            <span class="badge">
                Python
            </span>

            <span class="badge">
                Pandas
            </span>

            <span class="badge">
                Scikit-Learn
            </span>

            <span class="badge">
                Flask
            </span>

            <span class="badge">
                Regression
            </span>

        </div>

    </div>

</div>

</body>

</html>
